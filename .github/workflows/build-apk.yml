name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
          ndk-version: '25.2.9519653'

      - name: 📦 Install dependencies
        run: bun install

      - name: 🏗️ Build web app
        run: bun run build

      - name: 🔄 Sync Capacitor
        run: bunx cap sync android

      - name: 📱 Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 📤 Upload APK (signed release)
        continue-on-error: true
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk video-downloader-release.apk
          fi

      - name: 📏 Check APK size
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_SIZE=$(stat -c%s "android/app/build/outputs/apk/debug/app-debug.apk")
            APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1048576" | bc)
            echo "✅ APK ready! Size: ${APK_SIZE_MB}MB"
          fi

      - name: 💬 Comment APK download link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const apkPath = 'android/app/build/outputs/apk/debug/app-debug.apk';
            if (fs.existsSync(apkPath)) {
              const apkSize = fs.statSync(apkPath).size;
              const sizeMB = (apkSize / 1048576).toFixed(2);
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📱 APK Ready!\n\nAPK has been built successfully.\n\n**Size:** ${sizeMB} MB\n\nDownload the APK from the **Artifacts** section above (click on the build, then download \`video-downloader-apk\`).`
              });
            }
