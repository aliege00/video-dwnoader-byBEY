name: Build APK & EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.check-apk.outputs.apk_path }}

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: 🏗️ Build web
        run: bun run build

      - name: 🔄 Sync Capacitor
        run: bunx cap sync android

      - name: 📱 Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Copy APK to downloads
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/video-downloader.apk
          echo "APK_SIZE=$(stat -c%s downloads/video-downloader.apk)" >> $GITHUB_OUTPUT
        id: check-apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: downloads/video-downloader.apk

  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: 🏗️ Build web
        run: bun run build

      - name: 🔧 Install electron-builder globally
        run: bun install -g electron-builder

      - name: 🪟 Build EXE
        run: bun run build:exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Copy EXEs to downloads
        run: |
          New-Item -ItemType Directory -Force -Path downloads
          if (Test-Path "dist_electron/*.exe") {
            Copy-Item "dist_electron/*.exe" downloads/
          }
          if (Test-Path "dist_electron/*.exe") {
            echo "EXE_FOUND=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: 📤 Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-exe
          path: downloads/*.exe

  publish:
    name: 📦 Publish Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: video-downloader-apk
          path: downloads/

      - name: 📥 Download EXE
        uses: actions/download-artifact@v4
        with:
          name: video-downloader-exe
          path: downloads/
        continue-on-error: true

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Video Downloader Pro v1.0.${{ github.run_number }}
          body: |
            ## 📥 Video Downloader Pro v1.0.${{ github.run_number }}

            **Yenilikler:** Otomatik derleme

            ### 📱 Android
            - `video-downloader.apk` — Telefona kur, video indir

            ### 🪟 Windows
            - `Video-Downloader-Setup.exe` — Kurulumlu
            - `Video-Downloader-Portable.exe` — Taşınabilir (USB'den çalışır)

            **Nasıl kullanılır:** Videoyu indir → Kur/Kopyala → Link yapıştır → İndir! 🎉
          files: |
            downloads/video-downloader.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
