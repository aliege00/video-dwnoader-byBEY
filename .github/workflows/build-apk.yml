name: Build APK & EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: 🏗️ Build web
        run: bun run build

      - name: 🔄 Sync Capacitor
        run: bunx cap sync android

      - name: 🔑 Create keystore (if secrets set)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_CREATED=true" >> $GITHUB_ENV
            echo "✅ Keystore created from secrets"
          else
            echo "ℹ️ No keystore secrets found, building debug APK only"
            echo "KEYSTORE_CREATED=false" >> $GITHUB_ENV
          fi

      - name: 📱 Build APKs
        run: |
          cd android
          chmod +x gradlew
          export VERSION_CODE=${{ env.VERSION_CODE }}
          export VERSION_NAME=${{ env.VERSION_NAME }}
          export ANDROID_KEYSTORE_BASE64="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          export ANDROID_KEYSTORE_PATH="app/release.keystore"
          export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          
          ./gradlew assembleDebug
          if [ "$KEYSTORE_CREATED" = "true" ]; then
            ./gradlew assembleRelease
          fi

      - name: 📤 Copy APKs to downloads
        run: |
          mkdir -p downloads
          # Debug APK (always built)
          cp android/app/build/outputs/apk/debug/*.apk downloads/ 2>/dev/null || true
          # Release APK (if signed)
          cp android/app/build/outputs/apk/release/*.apk downloads/ 2>/dev/null || true
          echo "📁 Downloads folder contents:"
          ls -la downloads/
          
          # Set output for release notes
          echo "APK_VERSION=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
        id: apk-output

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: downloads/*.apk

  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: 🏗️ Build web
        run: bun run build

      - name: 🪟 Build EXE
        run: bun run build:exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Copy EXEs to downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads
          if (Test-Path "dist_electron/*.exe") { Copy-Item "dist_electron/*.exe" downloads/ }

      - name: 📤 Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-exe
          path: downloads/*.exe

  publish:
    name: 📦 Publish Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: video-downloader-apk
          path: downloads/

      - name: 📥 Download EXE
        uses: actions/download-artifact@v4
        with:
          name: video-downloader-exe
          path: downloads/
        continue-on-error: true

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Video Downloader Pro v1.0.${{ github.run_number }}
          body: |
            ## 📥 Video Downloader Pro v1.0.${{ github.run_number }}

            **Otomatik derleme #${{ github.run_number }}**

            ### 📱 Android
            - `VideoDownloader-debug-1.0.${{ github.run_number }}.apk` — Test APK (debug)
            - `VideoDownloader-release-1.0.${{ github.run_number }}.apk` — Play Store APK (imzalı) *varsa*

            ### 🪟 Windows
            - `Video-Downloader-Setup.exe` — Kurulumlu
            - `Video-Downloader-Portable.exe` — Taşınabilir

            ### 🌐 Web
            https://aliege00.github.io/video-dwnoader-byBEY/

            **Kullanım:** Link yapıştır → İndir! 🎉
          files: downloads/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
